<!DOCTYPE html>
<html>
<head>
  <title>Page Not Found - AdMediaX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Inter", sans-serif;;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      font-size: 8rem;
      color: #85ff64;
      line-height: 1;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    p {
      color: #aaa;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    a {
      color: #85ff64;
      text-decoration: none;
      border: 2px solid #85ff64;
      padding: 12px 32px;
      border-radius: 4px;
      display: inline-block;
      transition: all 0.3s;
    }

    a:hover {
      background: #85ff64;
      color: #0a0a0a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>AdMediaX can do anything but cannot find this page.</p>
    <a href="/">← Go Back Home</a>
  </div>
</body>
</html>
